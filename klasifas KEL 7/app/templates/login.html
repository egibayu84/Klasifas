{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex justify-content-center align-items-center mb-3" style="width: 60px; height: 60px;">
                    <i class="bi bi-shield-lock fs-2"></i>
                </div>
                <h4 class="fw-bold">Login Akun</h4>
                <p class="text-muted small">Masuk untuk mengelola laporan fasilitas</p>
            </div>
            
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label fw-medium">Email</label>
                    <input type="email" name="email" class="form-control" required placeholder="admin@klasifas.com">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium">Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-custom py-2">
                    Masuk <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>
            <p class="text-center mt-3 small">Belum punya akun? <a href="{{ url_for('auth.register') }}">Daftar di sini</a></p>
        </div>
    </div>
</div>
{% endblock %}
