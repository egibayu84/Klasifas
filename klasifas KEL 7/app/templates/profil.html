{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-6">
        <div class="card card-custom p-4">
            <div class="d-flex align-items-center mb-4 border-bottom pb-3">
                <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center me-3" style="width: 50px; height: 50px;">
                    <i class="bi bi-person fs-3"></i>
                </div>
                <div>
                    <h4 class="fw-bold mb-0">Profil Saya</h4>
                    <p class="text-muted small mb-0">Kelola informasi akun Anda</p>
                </div>
            </div>
            
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label fw-medium">Nama Lengkap</label>
                    <input type="text" name="nama" class="form-control" value="{{ current_user.nama }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-medium">Email (Tidak dapat diubah)</label>
                    <input type="email" class="form-control" value="{{ current_user.email }}" disabled readonly>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-medium">Peran</label>
                    <input type="text" class="form-control" value="{{ current_user.peran|capitalize }}" disabled readonly>
                </div>
                
                <hr class="my-4">
                <h6 class="fw-bold mb-3">Ganti Password (Opsional)</h6>
                
                <div class="mb-3">
                    <label class="form-label fw-medium">Password Lama</label>
                    <input type="password" name="password_lama" class="form-control" placeholder="Masukkan password lama">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium">Password Baru</label>
                    <input type="password" name="password_baru" class="form-control" placeholder="Minimal 6 karakter">
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-custom py-2">
                        <i class="bi bi-save me-2"></i> Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
