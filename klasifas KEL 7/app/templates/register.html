{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4">
            <div class="text-center mb-4">
                <h4 class="fw-bold">Daftar Akun</h4>
                <p class="text-muted small">Buat akun untuk melaporkan fasilitas</p>
            </div>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label fw-medium">Nama Lengkap</label>
                    <input type="text" name="nama" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium">Password</label>
                    <input type="password" name="password" class="form-control" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-custom py-2">Daftar</button>
            </form>
            <p class="text-center mt-3 small">Sudah punya akun? <a href="{{ url_for('auth.login') }}">Login di sini</a></p>
        </div>
    </div>
</div>
{% endblock %}
